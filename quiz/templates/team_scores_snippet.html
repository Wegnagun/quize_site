<!-- Заголовок панели -->
<div style="background-color: var(--color-primary); color: white; padding: 10px 15px; border-radius: 8px 8px 0 0; font-weight: bold;">
    🏆 Таблица лидеров
</div>

<div style="padding: 15px; background: #fff; border: 1px solid var(--color-border); border-top: none; border-radius: 0 0 8px 8px; height: calc(100% - 50px); overflow-y: auto;">

    {% if TEAM_RANKING %}
        
        <table class="table table-sm" style="font-size: 0.85rem; margin-bottom: 10px;">
            <thead style="background-color: #f1f3f5; position: sticky; top: 0; z-index: 1;">
                <tr>
                    <th style="width: 40px;">Место</th>
                    <th>Команда</th>
                    <th style="text-align: right; width: 70px;">Очки</th>
                </tr>
            </thead>
            <tbody>
                <!-- Цикл по уже отсортированному списку -->
                {% for team in TEAM_RANKING %}
                    <tr>
                        <td><strong>{{ forloop.counter }}</strong></td>
                        <td>{{ team.name }}</td>
                        <td style="text-align: right;"><span class="badge bg-success">{{ team.score }}</span></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    
        
    {% else %}
        {% if CURRENT_QUIZ %}
            <div class="alert alert-info text-center" style="margin-bottom: 0; font-size: 0.9rem;">
                В квизе пока нет команд.<br>
            </div>
        {% else %}
            <div class="alert alert-warning text-center" style="margin-bottom: 0; font-size: 0.9rem;">
                Квизы не созданы.<br>
                <a href="{% url 'team_scores' %}" style="display:block; margin-top:5px;">Создать игру</a>
            </div>
        {% endif %}
    {% endif %}

</div>
